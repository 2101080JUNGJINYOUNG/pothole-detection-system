<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    # Python WSGI 애플리케이션
    # Dockerfile이 pip3로 시스템 전역에 패키지를 설치하므로 venv를 쓰지 않습니다.
    # (예전 python-home=/var/www/app/venv 경로는 실제로 생성된 적이 없어 mod_wsgi가
    #  잘못된 인터프리터를 찾게 되는 버그였습니다.)
    WSGIDaemonProcess app python-path=/var/www/app
    WSGIProcessGroup app
    WSGIScriptAlias /app /var/www/app/app.wsgi

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/app>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # 정적 파일 서빙
    Alias /shared_images /var/www/html/shared_images
    <Directory /var/www/html/shared_images>
        Options -Indexes
        Require all granted
    </Directory>

    # 로그 설정
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

