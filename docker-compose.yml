# Docker Compose file for Deep-Guardian (2-Container LAMP Architecture)
# 발표자료(docs/references/)의 공식 아키텍처를 따릅니다.
# Container 1: inference (AI Core & Inference - YOLOv8 탐지, NPU Worker 호출)
# Container 2: lamp     (LAMP Web Server - Apache + MySQL + Flask 대시보드)
# Container 3: cloudflared (외부 접속용 터널, 선택)

services:
  # Container 1: LAMP Web Server (Apache + MySQL + Flask, 한 컨테이너에 통합)
  lamp:
    build:
      context: ./lamp-container
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: deep-guardian-lamp
    ports:
      - "80:80"
      - "3306:3306"
    volumes:
      - ./lamp-container/web:/var/www/html
      - ./lamp-container/app:/var/www/app
      - ./shared_images:/var/www/html/shared_images
      - ./django_app:/var/www/app/django_app:ro
      - ./database/init_mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./models/llm:/app/models/llm:ro
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=pothole_db
      - MYSQL_USER=pothole_user
      - MYSQL_PASSWORD=pothole_pass
      - DJANGO_SETTINGS_MODULE=django_app.settings
      - DATABASE_URL=mysql://pothole_user:pothole_pass@localhost:3306/pothole_db
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-deep-guardian-secret-key-change-in-production}
      - PHI3_MODEL_PATH=/app/models/llm/Phi-3-mini-int4
      - PHI3_DEVICE=NPU
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
    networks:
      - deep-guardian-network
    restart: unless-stopped

  # Container 2: AI Core & Inference (YOLOv8 탐지 + NPU Worker 호출 + 자동 파인튜닝)
  inference:
    build:
      context: ./inference-container
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: deep-guardian-inference
    volumes:
      - ./inference-container:/app
      - ./inference-container/models:/app/models
      - ./shared_images:/app/shared_images
      - ./inference-container/videos:/app/videos
      - ./django_app:/app/django_app:ro
    environment:
      - NPU_WORKER_URL=http://host.docker.internal:9001/depth
      - YOLO_MODEL_PATH=/app/models/best2.pt
      - KAKAO_MAP_APP_KEY=${KAKAO_MAP_APP_KEY:-}
      - DJANGO_SETTINGS_MODULE=django_app.settings
      - DATABASE_URL=mysql://pothole_user:pothole_pass@lamp:3306/pothole_db
      - USE_SYNTHETIC_POTHOLES=${USE_SYNTHETIC_POTHOLES:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - lamp
    networks:
      - deep-guardian-network
    restart: unless-stopped
    # GPU 지원 (WSL에서 사용 가능한 경우)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Container 3: cloudflared (외부 접속용 터널, 선택사항)
  cloudflared:
    build:
      context: ./cloudflared
      dockerfile: Dockerfile
    container_name: deep-guardian-tunnel
    environment:
      # ngrok authtoken 설정 (필수) - https://dashboard.ngrok.com/get-started/your-authtoken
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    depends_on:
      - lamp
    networks:
      - deep-guardian-network
    restart: unless-stopped

networks:
  deep-guardian-network:
    driver: bridge

volumes:
  mysql_data:
